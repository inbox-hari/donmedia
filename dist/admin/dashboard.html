<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin Dashboard — Donmedia</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <!-- Supabase client (ES Module) -->

  <style>
    /* Hide until auth is confirmed — prevents unauthenticated flash */
    body { visibility: hidden; }
    body.auth-ready { visibility: visible; }
  </style>
  <script type="module" crossorigin src="/assets/admin/dashboard-P-iOOgcd.js"></script>
  <link rel="modulepreload" crossorigin href="/assets/jsx-runtime-DOGvGpb-.js">
  <link rel="modulepreload" crossorigin href="/assets/modulepreload-polyfill-3xzlJT5O.js">
  <link rel="modulepreload" crossorigin href="/assets/supabase-client-BVBtXGiJ.js">
  <link rel="modulepreload" crossorigin href="/assets/MagazineCategory-D6FeMlAA.js">
  <link rel="modulepreload" crossorigin href="/assets/hero-stars-DmEzxE10.js">
  <link rel="stylesheet" crossorigin href="/assets/admin-A8oLe_lM.css">
</head>
<body>

<!-- ── Sidebar backdrop (mobile) ───────────────────────────── -->
<div class="sidebar-backdrop" id="sidebar-backdrop"></div>

<!-- ════════════════ LAYOUT ════════════════ -->
<div class="admin-layout">

  <!-- ── Sidebar ─────────────────────────────────────────────── -->
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-brand">
      <div class="brand-name"><i class="fas fa-hotairballoon"></i> DONMEDIA</div>
      <div class="brand-sub">Admin Panel</div>
    </div>

    <nav class="sidebar-nav">
      <div class="sidebar-section">Content</div>
      <button class="nav-link active" id="nav-books" onclick="switchTab('books')">
        <i class="fas fa-book"></i> Books
      </button>
      <button class="nav-link" id="nav-magazines" onclick="switchTab('magazines')">
        <i class="fas fa-newspaper"></i> Magazines
      </button>

      <div class="sidebar-section" style="margin-top:1.2rem">Site</div>
      <a class="nav-link" href="/index.html" target="_blank">
        <i class="fas fa-external-link-alt"></i> View Site
      </a>
      <a class="nav-link" href="/book-store.html" target="_blank">
        <i class="fas fa-store"></i> Book Store
      </a>
      <a class="nav-link" href="/magazines.html" target="_blank">
        <i class="fas fa-newspaper"></i> Magazine Page
      </a>
    </nav>

    <div class="sidebar-footer">
      <button class="logout-btn" id="logout-btn" onclick="handleLogout()">
        <i class="fas fa-sign-out-alt"></i> Sign out
      </button>
    </div>
  </aside>

  <!-- ── Main content ────────────────────────────────────────── -->
  <div class="admin-main">

    <!-- Topbar -->
    <div class="admin-topbar">
      <div style="display:flex;align-items:center;gap:.8rem">
        <button class="sidebar-toggle" id="sidebar-toggle" aria-label="Toggle menu">
          <i class="fas fa-bars"></i>
        </button>
        <span class="page-title" id="topbar-title">Books</span>
      </div>
      <div class="topbar-right">
        <div class="user-pill">
          <div class="avatar" id="user-avatar">A</div>
          <span id="user-email-display">Admin</span>
        </div>
      </div>
    </div>

    <!-- Body -->
    <div class="admin-body">

      <!-- Stats row -->
      <div class="stats-row" id="stats-row">
        <div class="stat-card">
          <div class="stat-icon blue"><i class="fas fa-book"></i></div>
          <div>
            <div class="stat-num" id="stat-books">—</div>
            <div class="stat-label">Total Books</div>
          </div>
        </div>
        <div class="stat-card">
          <div class="stat-icon green"><i class="fas fa-newspaper"></i></div>
          <div>
            <div class="stat-num" id="stat-magazines">—</div>
            <div class="stat-label">Total Magazines</div>
          </div>
        </div>
        <div class="stat-card">
          <div class="stat-icon red"><i class="fas fa-cloud-upload-alt"></i></div>
          <div>
            <div class="stat-num" id="stat-uploads">0</div>
            <div class="stat-label">Uploads Today</div>
          </div>
        </div>
      </div>

      <!-- Tab bar -->
      <div class="tab-bar">
        <button class="tab-btn active" id="tab-books-btn" onclick="switchTab('books')">
          <i class="fas fa-book"></i> Books
        </button>
        <button class="tab-btn" id="tab-magazines-btn" onclick="switchTab('magazines')">
          <i class="fas fa-newspaper"></i> Magazines
        </button>
      </div>

      <!-- ════ BOOKS TAB ════ -->
      <div class="tab-panel active" id="tab-books">
        <div class="panel-grid">

          <!-- Upload form -->
          <div class="card">
            <div class="card-header">
              <h3><i class="fas fa-plus-circle"></i> Upload New Book</h3>
            </div>
            <div class="card-body">
              <form id="book-upload-form" novalidate>

                <div class="form-field">
                  <label for="b-title">Title *</label>
                  <input type="text" id="b-title" placeholder="e.g. The Magic Forest" required />
                </div>



                <div class="form-field">
                  <label for="b-description">Description</label>
                  <textarea id="b-description" placeholder="Brief synopsis…" rows="3"></textarea>
                </div>

                <div class="form-field">
                  <label for="b-price">Price (₹ or $) *</label>
                  <input type="text" id="b-price" placeholder="e.g. 299 or 12.99" required />
                </div>

                <div class="form-field">
                  <label>Cover Image *</label>
                  <div class="file-drop" id="b-cover-drop">
                    <input type="file" id="b-cover-file" accept="image/*" />
                    <div class="file-icon"><i class="fas fa-image"></i></div>
                    <div class="file-hint">Click or drag an image here</div>
                    <div class="file-name" id="b-cover-name"></div>
                  </div>
                </div>

                <div class="form-field">
                  <label>PDF File *</label>
                  <div class="file-drop" id="b-pdf-drop">
                    <input type="file" id="b-pdf-file" accept="application/pdf" />
                    <div class="file-icon"><i class="fas fa-file-pdf"></i></div>
                    <div class="file-hint">Click or drag a PDF here</div>
                    <div class="file-name" id="b-pdf-name"></div>
                  </div>
                </div>

                <div class="upload-progress" id="b-progress">
                  <div class="progress-label" id="b-progress-label">Uploading…</div>
                  <div class="progress-bar-wrap">
                    <div class="progress-bar" id="b-progress-bar"></div>
                  </div>
                </div>

                <div class="error-msg" id="b-error"></div>

                <button type="submit" class="btn btn-green" id="b-submit-btn" style="margin-top:.8rem;width:100%">
                  <i class="fas fa-upload"></i> Upload Book
                </button>
              </form>
            </div>
          </div>

          <!-- Book list -->
          <div class="card">
            <div class="card-header">
              <h3><i class="fas fa-list"></i> All Books</h3>
              <button class="btn btn-ghost btn-sm" onclick="loadBooks()">
                <i class="fas fa-sync-alt"></i> Refresh
              </button>
            </div>
            <div style="overflow-x:auto">
              <table class="items-table" id="books-table">
                <thead>
                  <tr>
                    <th>Cover</th>
                    <th>Title / Description</th>
                    <th>Price</th>
                    <th>Actions</th>
                  </tr>
                </thead>
                <tbody id="books-tbody">
                  <tr><td colspan="4"><div class="empty-state"><i class="fas fa-book-open"></i><p>Loading books…</p></div></td></tr>
                </tbody>
              </table>
            </div>
          </div>

        </div><!-- /panel-grid -->
      </div><!-- /tab-books -->

      <!-- ════ MAGAZINES TAB ════ -->
      <div class="tab-panel" id="tab-magazines">
        <div id="admin-dashboard-root"></div>
      </div><!-- /tab-magazines -->

    </div><!-- /admin-body -->
  </div><!-- /admin-main -->
</div><!-- /admin-layout -->

<!-- Toast notification -->
<div class="toast" id="toast" role="status" aria-live="polite"></div>



<!-- ── JavaScript ────────────────────────────────────────────── -->
</body>
</html>
