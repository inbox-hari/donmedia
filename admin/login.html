<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin Login — Donmedia</title>
  <meta name="robots" content="noindex, nofollow" />
  <link rel="stylesheet" href="/admin/admin.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <!-- Supabase SDK + shared client (single source of truth) -->
  <!-- Supabase client (ES Module) -->


  <style>
    /* Hide body until auth state is resolved — prevents login flash */
    body { visibility: hidden; }
    body.auth-ready { visibility: visible; }

    /* Password toggle button */
    .password-wrap {
      position: relative;
    }
    .password-wrap input {
      padding-right: 2.8rem;
    }
    .pw-toggle {
      position: absolute;
      right: 0.75rem;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      cursor: pointer;
      color: #94a3b8;
      font-size: 1rem;
      padding: 0.2rem;
      transition: color 0.15s;
    }
    .pw-toggle:hover { color: #1e3799; }

    /* Friendly error badges */
    .error-msg {
      display: none;
      align-items: flex-start;
      gap: 0.5rem;
      background: #fee2e2;
      color: #dc2626;
      border-radius: 10px;
      padding: 0.7rem 1rem;
      font-size: 0.9rem;
      font-weight: 600;
      margin-top: 1rem;
      text-align: left;
      line-height: 1.4;
    }
    .error-msg.show { display: flex; }
    .error-msg i { margin-top: 2px; flex-shrink: 0; }

    /* Subtle auth-checking overlay */
    .auth-checking {
      position: fixed;
      inset: 0;
      background: linear-gradient(135deg, #0f172a 0%, #1e3799 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 9999;
      color: #fff;
      font-family: 'Nunito', sans-serif;
      font-size: 1rem;
      font-weight: 600;
      gap: 0.8rem;
    }
    .auth-checking.hidden { display: none; }
  </style>
</head>
<body>

<!-- Auth-checking overlay → shown while we resolve the existing session -->
<div class="auth-checking" id="auth-checking">
  <i class="fas fa-circle-notch fa-spin"></i>
  Verifying session…
</div>

<div class="login-page">
  <div class="login-card">
    <div class="login-logo">
      <i class="fas fa-hotairballoon"></i> DONMEDIA
    </div>
    <span class="login-badge">Admin Portal</span>

    <h2>Welcome back</h2>
    <p>Sign in with your admin credentials to manage content.</p>

    <form id="login-form" novalidate>
      <div class="form-field">
        <label for="admin-email">Email address</label>
        <input
          type="email"
          id="admin-email"
          placeholder="admin@donmedia.com"
          autocomplete="email"
          required
        />
      </div>

      <div class="form-field">
        <label for="admin-password">Password</label>
        <div class="password-wrap">
          <input
            type="password"
            id="admin-password"
            placeholder="••••••••"
            autocomplete="current-password"
            required
          />
          <button type="button" class="pw-toggle" id="pw-toggle" aria-label="Toggle password visibility">
            <i class="fas fa-eye" id="pw-eye"></i>
          </button>
        </div>
      </div>

      <button type="submit" class="btn btn-primary" id="login-btn">
        <i class="fas fa-sign-in-alt"></i>
        Sign In
      </button>

      <div class="error-msg" id="login-error" role="alert">
        <i class="fas fa-exclamation-circle"></i>
        <span id="login-error-text"></span>
      </div>
    </form>
  </div>
</div>

<script type="module" src="/src/script.js"></script>
<script type="module" src="/src/hero-stars.js"></script>


<script type="module">
import { supabase } from '/src/supabase-client.js';

/* ================================================================
   Configured for ES Modules
   ================================================================ */

const authOverlay = document.getElementById('auth-checking');
const errEl       = document.getElementById('login-error');
const errTextEl   = document.getElementById('login-error-text');

/* ── Friendly error message map ──────────────────────────────── */
function friendlyError(rawMessage) {
  if (!rawMessage) return 'Something went wrong. Please try again.';
  const m = rawMessage.toLowerCase();

  if (m.includes('invalid login credentials') || m.includes('invalid email or password'))
    return 'Incorrect email or password. Please check your credentials and try again.';

  if (m.includes('email not confirmed'))
    return 'Your email address has not been confirmed. Please check your inbox.';

  if (m.includes('too many requests') || m.includes('rate limit'))
    return 'Too many login attempts. Please wait a moment and try again.';

  if (m.includes('user not found'))
    return 'No admin account found with that email address.';

  if (m.includes('network') || m.includes('fetch'))
    return 'Network error. Please check your internet connection and try again.';

  // Fall back to the raw message if we don't have a mapping
  return rawMessage;
}

function showError(msg) {
  errTextEl.textContent = msg;
  errEl.classList.add('show');
  document.getElementById('admin-password').value = '';
  document.getElementById('admin-password').focus();
}
function clearError() {
  errEl.classList.remove('show');
  errTextEl.textContent = '';
}

/* ── Session check — redirect if already logged in ───────────── */
(async () => {
  try {
    const { data: { session } } = await supabase.auth.getSession();
    if (session) {
      // Already authenticated — go straight to dashboard
      window.location.replace('dashboard.html');
      return;
    }
  } catch (e) {
    // Network or SDK error during check — show the form anyway
    console.warn('Session check failed:', e);
  }

  // Not logged in — reveal the page
  authOverlay.classList.add('hidden');
  document.body.classList.add('auth-ready');
})();

/* ── Password show/hide toggle ───────────────────────────────── */
const pwInput  = document.getElementById('admin-password');
const pwToggle = document.getElementById('pw-toggle');
const pwEye    = document.getElementById('pw-eye');

pwToggle.addEventListener('click', () => {
  const isHidden = pwInput.type === 'password';
  pwInput.type   = isHidden ? 'text' : 'password';
  pwEye.className = isHidden ? 'fas fa-eye-slash' : 'fas fa-eye';
  pwToggle.setAttribute('aria-label', isHidden ? 'Hide password' : 'Show password');
});

/* ── Login form submission ───────────────────────────────────── */
const form    = document.getElementById('login-form');
const emailEl = document.getElementById('admin-email');
const passEl  = document.getElementById('admin-password');
const btnEl   = document.getElementById('login-btn');

form.addEventListener('submit', async (e) => {
  e.preventDefault();
  clearError();

  const email    = emailEl.value.trim();
  const password = passEl.value;

  if (!email) {
    showError('Please enter your email address.');
    emailEl.focus();
    return;
  }
  if (!password) {
    showError('Please enter your password.');
    passEl.focus();
    return;
  }

  btnEl.disabled  = true;
  btnEl.innerHTML = '<i class="fas fa-circle-notch fa-spin"></i> Signing in…';

  try {
    const { data, error } = await supabase.auth.signInWithPassword({ email, password });

    if (error) {
      showError(friendlyError(error.message));
    } else if (data?.session) {
      // Login succeeded — brief success state then redirect
      btnEl.innerHTML = '<i class="fas fa-check"></i> Success!';
      btnEl.style.background = '#16a34a';
      setTimeout(() => { window.location.replace('dashboard.html'); }, 500);
      return; // don't re-enable the button
    } else {
      // Supabase returned no error and no session — unexpected
      showError('Login failed for an unknown reason. Please try again.');
    }
  } catch (err) {
    // Network-level failure
    showError(friendlyError(err.message));
  }

  btnEl.disabled  = false;
  btnEl.innerHTML = '<i class="fas fa-sign-in-alt"></i> Sign In';
});

/* ── Clear error when user starts typing again ───────────────── */
emailEl.addEventListener('input', clearError);
passEl.addEventListener('input',  clearError);
</script>
</body>
</html>
